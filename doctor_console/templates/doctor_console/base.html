{% extends "base.html" %}

{% block extra_style %}
<style>
.shell{max-width:60rem}
.toolbar{display:flex;justify-content:space-between;align-items:center;gap:16px;margin:0 0 16px}
.toolbar a{color:var(--accent);font-weight:600;text-decoration:none}
.toolbar a:hover{text-decoration:underline}
.linklike{background:none;border:0;padding:0;font:inherit;font-weight:600;color:var(--muted);cursor:pointer}
.linklike:hover{color:var(--ink)}
.room{display:inline-flex;align-items:center;gap:8px;border-radius:999px;padding:6px 16px;font-size:.9em;font-weight:600}
.room.busy{background:var(--alert-soft);color:var(--alert)}
.room.free{background:var(--accent-soft);color:var(--accent)}
.queue{list-style:none;margin:0;padding:0}
.queue li{display:flex;align-items:center;gap:16px;padding:16px 0;border-top:1px solid var(--line)}
.queue li:first-child{border-top:0}
.rank{flex:0 0 2.4em;height:2.4em;display:grid;place-items:center;border-radius:50%;
  background:var(--accent-soft);color:var(--accent);font-weight:700}
.who{flex:1 1 auto;min-width:0}
.who a{color:inherit;font-weight:600;text-decoration:none}
.who a:hover{text-decoration:underline}
.meta{display:block;color:var(--muted);font-size:.9em}
.tag{display:inline-block;border:1px solid var(--line);border-radius:999px;padding:1px 10px;
  font-size:.8em;color:var(--muted);margin-left:8px}
.action{font-size:.95em;font-weight:600;font-family:inherit;padding:10px 18px;border:0;
  border-radius:10px;background:var(--accent);color:#fff;cursor:pointer;white-space:nowrap}
.action:hover{background:var(--accent-dark)}
.action.finish{background:var(--alert)}
.action:disabled{background:#c9d2d0;cursor:not-allowed}
.rows{margin:0}
.rows > div{display:flex;gap:16px;padding:12px 0;border-top:1px solid var(--line)}
.rows dt{flex:0 0 7em;margin:0;color:var(--muted)}
.rows dd{flex:1 1 auto;margin:0}
.clinical{margin:24px 0 0;padding:20px 22px;background:var(--accent-soft);
  border:1px solid var(--accent-line);border-radius:var(--radius)}
.clinical h2{margin:0 0 4px;font-size:1.05em}
.clinical h2 + p{margin:0 0 16px}
.clinical p:last-child{margin-bottom:0}
.empty{color:var(--muted);padding:20px 0}
.actions{margin:24px 0 0}
</style>
{% endblock %}
