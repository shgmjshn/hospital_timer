{% extends "base.html" %}

{% block title %}医師ログイン{% endblock %}

{% block content %}
<div class="card">
  <h1>医師ログイン</h1>
  <p class="lede">症状と自由記述の閲覧には医師ロールが必要です。</p>

  {% if form.errors %}
  <div class="notice strong"><p>ユーザー名またはパスワードが正しくありません。</p></div>
  {% endif %}

  <form method="post">
    {% csrf_token %}
    <div class="field">
      <label class="field-label" for="{{ form.username.id_for_label }}">ユーザー名</label>
      {{ form.username }}
    </div>
    <div class="field">
      <label class="field-label" for="{{ form.password.id_for_label }}">パスワード</label>
      {{ form.password }}
    </div>
    <button class="submit" type="submit">ログイン</button>
  </form>
</div>
{% endblock %}
